<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Vehicle | KurtonBerg Agency</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">
    <div class="container my-5" style="max-width: 600px;">
        <div class="card bg-secondary p-4 shadow">
            <h2 class="text-warning mb-4">List New Vehicle (Brokerage)</h2>
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-warning w-100 fw-bold">Publish to Marketplace</button>
            </form>
            <a href="{% url 'home' %}" class="btn btn-link text-light mt-3">Back to Marketplace</a>
        </div>
    </div>
</body>
</html>
