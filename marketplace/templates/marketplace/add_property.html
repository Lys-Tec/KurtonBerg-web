<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Real Estate Property | KurtonBerg Agency</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --kb-navy: #0B132B;
            --kb-card: #1C2541;
            --kb-gold: #D4AF37;
            --kb-gold-hover: #F3C653;
        }
        body {
            background-color: var(--kb-navy);
            color: #E0E1DD;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card-custom {
            background-color: var(--kb-card);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 8px;
        }
        .btn-gold {
            background-color: var(--kb-gold);
            color: var(--kb-navy);
            font-weight: bold;
        }
        .btn-gold:hover {
            background-color: var(--kb-gold-hover);
            color: var(--kb-navy);
        }
    </style>
</head>
<body>

<div class="container my-5" style="max-width: 650px;">
    <div class="card card-custom p-4 p-md-5 shadow-lg">
        <div class="text-center mb-4">
            <i class="fa-solid fa-building-shield fa-3x mb-3" style="color: var(--kb-gold);"></i>
            <h2 class="fw-bold text-white">List New Real Estate Property</h2>
            <p class="text-secondary small">Publish verified land, villas, and commercial listings under KurtonBerg Agency brokerage oversight.</p>
        </div>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="d-grid mt-4">
                <button type="submit" class="btn btn-gold btn-lg">Publish Property to Marketplace</button>
            </div>
        </form>

        <div class="text-center mt-4">
            <a href="{% url 'home' %}" class="text-secondary text-decoration-none small"><i class="fa-solid fa-arrow-left me-1"></i> Back to Marketplace Catalog</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
