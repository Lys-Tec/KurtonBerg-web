<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KurtonBerg Agency | Luxury Real Estate & Automotive</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-dark text-light">
    <!-- Navbar -->
    <a class="navbar-brand fw-bold" href="{% url 'home' %}" style="color: #d4af37; font-family: serif; font-size: 1.5rem;">
    <i class="fa-solid fa-gem me-2"></i>KurtonBerg Agency
</a>
<div class="d-flex align-items-center gap-3">
    <a href="{% url 'home' %}" class="text-light text-decoration-none fw-semibold">Marketplace</a>
    <a href="/admin/" class="btn btn-sm px-3 fw-bold text-dark" style="background-color: #d4af37;">Admin Portal</a>
</div>
    <!-- Main Content Block -->
    <main>
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-black text-white-50 text-center py-4 border-top border-secondary mt-5">
        <div class="container">
            <p class="mb-0 small">&copy; 2026 KurtonBerg Agency Zambia. All rights reserved.</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
