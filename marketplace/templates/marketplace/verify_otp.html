<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verify OTP - KurtonBerg Agency</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --kb-navy: #0F172A;
            --kb-gold: #C9A227;
            --kb-gold-hover: #b08d1f;
            --kb-card-bg: #1e293b;
        }
        body {
            background-color: var(--kb-navy);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #f8f9fa;
        }
        .card-custom {
            background-color: var(--kb-card-bg);
            border: 1px solid rgba(201, 162, 39, 0.2);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            color: #ffffff;
        }
        .form-control {
            background-color: #0f172a;
            border-color: #334155;
            color: #ffffff;
        }
        .form-control:focus {
            background-color: #0f172a;
            border-color: var(--kb-gold);
            color: #ffffff;
            box-shadow: 0 0 0 0.25rem rgba(201, 162, 39, 0.25);
        }
        .form-label {
            color: #cbd5e1;
        }
        .btn-gold {
            background-color: var(--kb-gold);
            color: #0F172A;
            font-weight: 600;
        }
        .btn-gold:hover {
            background-color: var(--kb-gold-hover);
            color: #0F172A;
        }
        a {
            color: var(--kb-gold);
        }
        a:hover {
            color: #e6b82e;
        }
        .text-muted {
            color: #94a3b8 !important;
        }
    </style>
</head>
<body class="d-flex align-items-center py-5" style="min-height: 100vh;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="text-center mb-4">
                    <a href="{% url 'welcome' %}" class="text-decoration-none fs-3 fw-bold text-white">
                        <i class="fa-solid fa-gem me-2" style="color: var(--kb-gold);"></i>KurtonBerg Agency
                    </a>
                </div>
                <div class="card card-custom p-4 text-center">
                    <h2 class="fw-bold mb-3 text-white">Enter Verification Code</h2>
                    <p class="text-muted small mb-4">We've sent a 6-digit OTP code to your registered email address.</p>
                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-danger bg-danger text-white border-0">{{ message }}</div>
                        {% endfor %}
                    {% endif %}
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <input type="text" name="otp" class="form-control text-center fs-3 tracking-widest" placeholder="123456" maxlength="6" required>
                        </div>
                        <button type="submit" class="btn btn-gold w-100 py-2 fw-semibold">Verify & Login</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
